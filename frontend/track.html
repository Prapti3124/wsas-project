<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SAKHI Live Tracking</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css?v=2.1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <style>
    :root {
      --bg-dark: #0f101f;
      --card-bg: #1a1b2e;
      --pink-primary: #e91e63;
      --pink-light: #ff6090;
    }
    body {
      background-color: var(--bg-dark);
      color: #fff;
      font-family: 'Inter', sans-serif;
      margin: 0;
      overflow: hidden;
    }
    #map {
      height: 100vh;
      width: 100vw;
      filter: contrast(1.1) saturate(1.2);
    }
    .tracking-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      background: rgba(26, 27, 46, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      padding: 15px 20px;
      border-bottom: 1px solid rgba(233, 30, 140, 0.3);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .pulse-dot {
      display: inline-block;
      width: 10px; height: 10px;
      background: #00e676;
      border-radius: 50%;
      box-shadow: 0 0 10px #00e676;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(0, 230, 118, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
    }
    .loading-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg-dark);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .user-avatar {
        width: 40px; height: 40px; border-radius: 50%;
        background: var(--pink-primary);
        display: flex; align-items: center; justify-content: center;
        font-weight: bold; font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner-border text-pink mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
    <h4 class="fw-bold">Locating User...</h4>
    <p class="text-secondary" id="loadingMsg">Verifying secure token</p>
  </div>

  <div class="tracking-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      <div class="user-avatar" id="userInitial">?</div>
      <div>
        <h5 class="m-0 fw-bold d-flex align-items-center gap-2">
          <span id="userName">Tracking User</span> 
          <span class="badge bg-success rounded-pill" style="font-size: 0.6rem;"><span class="pulse-dot me-1"></span> LIVE</span>
        </h5>
        <div class="text-muted small mt-1">
          <i class="fas fa-clock text-pink me-1"></i> Updated: <span id="lastUpdated">Just now</span>
        </div>
      </div>
    </div>
    
    <div class="text-end">
        <a id="phoneLink" href="#" class="btn btn-outline-light btn-sm rounded-pill px-3" style="border-color: var(--pink-primary); color: var(--pink-primary);">
            <i class="fas fa-phone-alt me-1"></i> Call
        </a>
    </div>
  </div>

  <div id="map"></div>

  <!-- Error Modal -->
  <div class="modal fade" id="errorModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background-color: var(--card-bg); border: 1px solid rgba(233, 30, 140, 0.3);">
        <div class="modal-body text-center p-5">
          <i class="fas fa-link-slash fa-4x text-danger mb-4"></i>
          <h4 class="fw-bold text-white mb-2" id="errorTitle">Session Ended</h4>
          <p class="text-muted" id="errorText">This tracking link has expired or the user has stopped sharing their location.</p>
          
          <div id="debugInfo" class="d-none text-start mt-3 p-2 rounded bg-black" style="font-family: monospace; font-size: 0.7rem; border: 1px solid #333;">
              <div class="text-secondary">Token: <span id="debugToken" class="text-info"></span></div>
              <div class="text-secondary">Status: <span id="debugStatus" class="text-warning"></span></div>
          </div>

          <div class="mt-4 d-grid gap-2">
              <button class="btn btn-pink py-2" onclick="location.reload()">
                  <i class="fas fa-sync-alt me-2"></i> Try Again / Refresh
              </button>
              <button class="btn btn-link btn-sm text-secondary text-decoration-none" onclick="toggleDebug()">
                  <i class="fas fa-bug me-1"></i> Technical Details
              </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    let map = null;
    let marker = null;
    let pulseCircle = null;
    let initRetries = 0;
    const MAX_INIT_RETRIES = 12;   // Increased to 12 attempts (~30 seconds total)
    const RETRY_DELAY_MS = 2500;   // 2.5 seconds between retries

    if (!token) {
        showError("Invalid tracking link. No token provided.");
    } else {
        initTracking();
    }

    function showError(msg, title = "Session Ended", status = "Error") {
        document.getElementById('loadingOverlay').classList.add('d-none');
        document.getElementById('errorTitle').textContent = title;
        document.getElementById('errorText').textContent = msg;
        document.getElementById('debugToken').textContent = token || 'None';
        document.getElementById('debugStatus').textContent = status;
        const errModal = new bootstrap.Modal(document.getElementById('errorModal'));
        errModal.show();
    }

    function toggleDebug() {
        document.getElementById('debugInfo').classList.toggle('d-none');
    }

    // Returns location data, throws only on definitive "session expired" (404).
    // On server errors (5xx) or network failures, returns null so caller can retry.
    async function fetchLocation() {
        let res;
        try {
            res = await fetch(`/api/location/tracking/public/${token}`);
        } catch(networkErr) {
            // Pure network failure — signal a retryable error
            console.warn('Network error fetching location:', networkErr);
            return null;
        }

        if (res.status === 202) {
            const data = await res.json();
            return { isWaiting: true, name: data.name };
        }

        if (res.status === 404) {
            const data = await res.json().catch(() => ({}));
            return { is404: true, error: data.error, status: res.status };
        }

        if (!res.ok) {
            // Server error (500 etc.) — retryable
            console.warn(`Server error ${res.status} — will retry`);
            return null;
        }

        return await res.json();
    }

    async function initTracking() {
        const loadingMsg = document.getElementById('loadingMsg');

        let data = null;
        try {
            data = await fetchLocation();
        } catch(definitiveErr) {
            // 404 / token invalid — show error immediately, no retry
            showError(definitiveErr.message);
            return;
        }

        // Handle 404 (session expired/invalid) - don't retry
        if (data && data.is404) {
            showError(data.error || 'Tracking link is no longer active.', "Link Error", `HTTP 404`);
            return;
        }

        // Handle transient failures (null)
        if (data === null) {
            initRetries++;
            if (initRetries <= MAX_INIT_RETRIES) {
                loadingMsg.textContent = `Connecting... (attempt ${initRetries + 1} of ${MAX_INIT_RETRIES + 1})`;
                setTimeout(initTracking, RETRY_DELAY_MS);
                return;
            } else {
                showError('Could not connect to the tracking server. Please check your connection and try again.', "Connection Failed", "Network Error");
                return;
            }
        }

        // Reset retry counter on success
        initRetries = 0;

        // Waiting for the sharer's device to push location data
        if (data.isWaiting) {
            document.getElementById('userName').textContent = data.name || 'User';
            document.getElementById('userInitial').textContent = (data.name || '?').charAt(0).toUpperCase();
            loadingMsg.textContent = 'Waiting for ' + (data.name || 'user') + '\u2019s device to send location...';
            setTimeout(initTracking, 5000);
            return;
        }

        // ── We have real location data ──────────────────────────────────────
        document.getElementById('userName').textContent = data.name || 'User';
        document.getElementById('userInitial').textContent = (data.name || '?').charAt(0).toUpperCase();

        if (data.phone) {
            document.getElementById('phoneLink').href = `tel:${data.phone}`;
        } else {
            document.getElementById('phoneLink').classList.add('d-none');
        }
        updateTime(data.recorded_at);

        // Initialize Map
        map = L.map('map', { zoomControl: false }).setView([data.latitude, data.longitude], 16);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        marker = L.circleMarker([data.latitude, data.longitude], {
            radius: 10, fillColor: '#e91e63', color: '#fff', weight: 2, fillOpacity: 1
        }).addTo(map);

        pulseCircle = L.circleMarker([data.latitude, data.longitude], {
            radius: 30, fillColor: 'transparent', color: '#e91e63', weight: 1, opacity: 0.6
        }).addTo(map);

        document.getElementById('loadingOverlay').classList.add('d-none');

        // Start polling every 5 seconds
        setInterval(updateLocation, 5000);
    }

    async function updateLocation() {
        let data = null;
        try {
            data = await fetchLocation();
        } catch(definitiveErr) {
            // Session expired while viewing — show error
            showError(definitiveErr.message);
            return;
        }

        // null = transient network error, skip this poll cycle silently
        if (!data || data.isWaiting) return;

        const latlng = [data.latitude, data.longitude];
        if (marker) {
            marker.setLatLng(latlng);
            pulseCircle.setLatLng(latlng);
            map.panTo(latlng, { animate: true });
        }
        updateTime(data.recorded_at);
    }

    function updateTime(isoString) {
        const date = new Date(isoString);
        let hours = date.getHours();
        let mins = date.getMinutes();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        mins = mins < 10 ? '0' + mins : mins;
        document.getElementById('lastUpdated').textContent = `${hours}:${mins} ${ampm}`;
    }
  </script>
</body>
</html>
